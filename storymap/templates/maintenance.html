<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoryMapJS &mdash; Down for Maintenance</title>
<link rel="shortcut icon" href="https://cdn.knightlab.com/libs/blueline/latest/assets/logos/favicon.ico">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f4f2;
    color: #222;

  nav {
    background: #1a1a1a;

  nav img {
    height: 28px;
    display: block;
  }

  main {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10vh 20px;
  }

  .card {
    max-width: 560px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    padding: 40px 44px;
    text-align: center;
  }

  .icon {
    font-size: 40px;
    margin-bottom: 8px;
  }

  h1 {
    font-size: 24px;
    margin: 0 0 16px;
    color: #1a1a1a;
  }

  p {
    font-size: 16px;
    line-height: 1.6;
    color: #444;
    margin: 0 0 14px;
  }

  .footer-note {
    font-size: 13px;
    color: #888;
    margin-top: 24px;
  }

  a {
    color: #1dacd6;
  }
</style>
</head>
<body>

<nav>
  <img src="https://cdn.knightlab.com/libs/orangeline/latest/assets/knightlab-dark.png" alt="Knight Lab">
</nav>

<main>
  <div class="card">
    <div class="icon">&#128295;</div>
    <h1>StoryMapJS is down for maintenance</h1>
    <p>The StoryMap editor will be back shortly. Thank you for your patience.</p>
    <p class="footer-note">
      Questions? Reach out at
      <a href="mailto:knightlab@northwestern.edu">knightlab@northwestern.edu</a>
    </p>
  </div>
</main>

</html>
